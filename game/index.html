<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turkey Run: Kabur dari Peternakan</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1d12; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .btn {
    font-family: 'Trebuchet MS', Verdana, sans-serif;
    font-weight: bold;
    border: 3px solid #fff6e0;
    border-radius: 14px;
    background: #b5533c;
    color: #fff6e0;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .btn:active { background: #8c2f26; }
  #mute-btn { position: fixed; top: 118px; right: 12px; z-index: 20; padding: 10px 16px; font-size: 16px; background: #5d7a2e; }
  #menu-buttons {
    position: fixed; left: 50%; bottom: 4%; transform: translateX(-50%);
    display: none; gap: 16px; z-index: 20;
  }
  #menu-buttons .btn { padding: 16px 30px; font-size: 22px; }
  #menu-buttons .btn.help { background: #5d7a2e; }
  #over-buttons {
    position: fixed; left: 50%; bottom: 4%; transform: translateX(-50%);
    display: none; gap: 16px; z-index: 20;
  }
  #over-buttons .btn { padding: 16px 30px; font-size: 22px; }
  #touch-pad { position: fixed; inset: auto 0 0 0; display: none; z-index: 15; pointer-events: none; }
  #touch-pad .pad-left { position: absolute; left: 18px; bottom: 18px; display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 64px); gap: 8px; pointer-events: auto; }
  #touch-pad .pad-right { position: absolute; right: 18px; bottom: 18px; display: flex; gap: 12px; pointer-events: auto; }
  #touch-pad .btn { width: 64px; height: 64px; font-size: 24px; border-radius: 50%; }
  #touch-pad .btn.wide { width: 92px; height: 92px; font-size: 18px; }
  #touch-pad .btn.jump { background: #d9a441; }
  #touch-pad .btn.dash { background: #3a5a8c; }
</style>
</head>
<body>
<canvas id="game" aria-label="Turkey Run: larikan kalkun dari petani melewati peternakan, ladang jagung dan dapur menuju hutan"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<button id="mute-btn" class="btn" data-btn="mute">Suara: Nyala</button>
<div id="menu-buttons">
  <button class="btn" data-btn="start">▶ MULAI</button>
  <button class="btn help" data-btn="help">? CARA MAIN</button>
</div>
<div id="over-buttons">
  <button class="btn" data-btn="restart">↻ MAIN LAGI</button>
</div>
<div id="touch-pad">
  <div class="pad-left">
    <span></span>
    <button class="btn" data-btn="up">▲</button>
    <span></span>
    <button class="btn" data-btn="left">◀</button>
    <button class="btn" data-btn="down">▼</button>
    <button class="btn" data-btn="right">▶</button>
  </div>
  <div class="pad-right">
    <button class="btn dash wide" data-btn="dash">DASH</button>
    <button class="btn jump wide" data-btn="jump">LOMPAT</button>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
